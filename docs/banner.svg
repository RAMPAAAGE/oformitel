<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3fae"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" fill="#fff">
    <circle cx="1080" cy="40" r="140"/>
    <circle cx="140" cy="300" r="110"/>
  </g>

  <!-- лист документа -->
  <g transform="translate(860 52) rotate(6)">
    <rect width="190" height="230" rx="12" fill="#0b1f66" opacity="0.25" transform="translate(8 10)"/>
    <rect width="190" height="230" rx="12" fill="url(#page)"/>
    <rect x="58" y="26" width="74" height="10" rx="5" fill="#1d3fae"/>
    <g fill="#9fb3e8">
      <rect x="34" y="58" width="122" height="7" rx="3.5"/>
      <rect x="22" y="76" width="134" height="7" rx="3.5"/>
      <rect x="22" y="94" width="134" height="7" rx="3.5"/>
      <rect x="22" y="112" width="96" height="7" rx="3.5"/>
      <rect x="34" y="138" width="122" height="7" rx="3.5"/>
      <rect x="22" y="156" width="134" height="7" rx="3.5"/>
      <rect x="22" y="174" width="110" height="7" rx="3.5"/>
    </g>
    <circle cx="160" cy="200" r="22" fill="#22c55e"/>
    <path d="M149 200 l8 8 l14 -16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="80" y="135" fill="#fff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">Оформитель документов</text>
  <text x="82" y="185" fill="#dbe6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">Word-файл по ГОСТу за пару кликов: поля, шрифт,</text>
  <text x="82" y="220" fill="#dbe6ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26">интервалы, оглавление и титульный лист</text>
</svg>
